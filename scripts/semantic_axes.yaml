# 全局语义轴配置，Semantic Anchor Library 会从这里读取可用轴定义
# 后续新增语义轴时，只需要在 semantic_axes 下追加配置项，不需要修改 Milvus Service 代码
semantic_axes:
  - axis_name: color_saturation
    label: 服装色彩饱和度
    description: >-
      低饱和 ←→ 高饱和。该轴只描述服装用色的鲜艳程度。
      低方向 value -1~-0.5：喜欢浅色系、低饱和、清淡颜色、奶油色、莫兰迪色、雾霾蓝、燕麦色、柔和配色，拒绝艳丽、荧光、撞色、太扎眼。
      中性 value -0.2~0.2：没有明显色彩偏好、基础色、黑白灰棕、颜色舒服即可。
      高方向 value 0.5~1：喜欢鲜艳色、明亮色、高饱和、撞色、多巴胺穿搭、强视觉冲击、红色黄色绿色等醒目色彩。
  - axis_name: accessory_level
    label: 配饰接受程度
    description: >-
      无配饰 ←→ 丰富配饰。该轴只描述耳环、项链、戒指、帽子、包、发饰、眼镜等装饰物的数量和存在感。
      低方向 value -1~-0.5：喜欢极简、不戴首饰、配饰越少越好、干净利落、不要累赘装饰，拒绝夸张耳环、层叠项链、复杂头饰。
      中性 value -0.2~0.2：可有可无、简单点缀、日常小饰品、不抢主体。
      高方向 value 0.5~1：喜欢耳环项链、帽子包包搭配、精致装饰、叠戴、珍珠、金属感、发带、墨镜等强化造型的配饰。
      生成锚点时区分“完全不要配饰”“少量点缀”“配饰丰富但协调”。
  - axis_name: makeup_intensity
    label: 妆容浓淡
    description: >-
      清淡 ←→ 浓妆。该轴描述人像妆容的可见强度，包括底妆、眼妆、唇色、修容和整体妆感。
      低方向 value -1~-0.5：裸妆、素颜感、伪素颜、清透底妆、水光肌、自然眉眼、淡唇色，拒绝厚粉、浓眼妆、大红唇。
      中性 value -0.2~0.2：日常淡妆、气色好即可、干净自然、有妆但不重。
      高方向 value 0.5~1：浓妆、欧美妆、烟熏妆、红唇、猫眼眼线、强修容、舞台妆、精致全妆、妆容存在感强。
      生成锚点时避免把“风格成熟”“性感”直接当作浓妆，必须落到妆容细节。
  - axis_name: pose_staged
    label: 姿势摆拍感
    description: >-
      自然抓拍 ←→ 明显摆拍。该轴描述拍照姿势是否刻意设计、是否有模特感和摄影指导感。
      低方向 value -1~-0.5：自然抓拍、松弛感、不看镜头、像路人随手拍、不刻意摆姿势、生活化动作、走路回头、整理头发。
      中性 value -0.2~0.2：简单站姿或坐姿、轻微引导、自然但有构图。
      高方向 value 0.5~1：模特姿势、杂志感动作、明显设计动作、定格 pose、强凹造型、专业棚拍姿态、舞台化姿势。
      生成锚点时不要和 body_openness 混淆：摆拍感高不一定动作大。
  - axis_name: body_openness
    label: 姿势开放程度
    description: >-
      收敛小动作 ←→ 舒展大动作。该轴描述肢体打开程度、动作幅度和动态张力。
      低方向 value -1~-0.5：小动作、内敛、安静、双手靠近身体、抱臂、坐姿收拢、低头、身体线条紧凑。
      中性 value -0.2~0.2：正常站坐、轻微伸展、动作不过分。
      高方向 value 0.5~1：张开手脚、大动作、奔跑跳跃、挥手、转圈、舒展身体、动态感、肢体线条打开。
      生成锚点时区分“自然抓拍”和“动作开放”，可包含运动、街拍、海边、草地等场景。
  - axis_name: emotion_expression
    label: 情绪表达强度
    description: >-
      平静治愈 ←→ 强烈表达。该轴描述照片传达的情绪外放程度和戏剧张力，不等同于甜美或成熟。
      低方向 value -1~-0.5：温柔、治愈、安静、清冷、淡淡的、疏离、松弛、平和、情绪不外露、无强烈表情。
      中性 value -0.2~0.2：自然微笑、舒服、有情绪但不夸张。
      高方向 value 0.5~1：热烈、强情绪、戏剧感、张扬、性感张力、强烈眼神、大笑、哭感、愤怒感、故事冲突感。
      生成锚点时覆盖用户说“不要太用力”“想要更有表现力”等隐含表达。
  - axis_name: lighting_strength
    label: 光线强度
    description: >-
      柔光低对比 ←→ 强光高对比。该轴只描述光线强弱、软硬、阴影和对比度。
      低方向 value -1~-0.5：柔和光线、自然光、阴天光、窗边柔光、低对比、氛围感、奶油光、没有硬阴影，拒绝强烈曝光和锐利阴影。
      中性 value -0.2~0.2：光线清楚、正常曝光、不过亮不过暗。
      高方向 value 0.5~1：强烈光影、硬光、高对比、阳光直射、闪光灯、明暗反差、轮廓光、舞台光、电影感硬阴影。
      生成锚点时避免把高饱和色彩误判为强光。
  - axis_name: fashion_level
    label: 风格时尚度
    description: >-
      日常生活感 ←→ 高时尚大片感。该轴描述造型整体的潮流程度、设计感和杂志/秀场属性。
      低方向 value -1~-0.5：日常穿搭、生活感、简单舒服、通勤、邻家、随手拍、不夸张、不像大片。
      中性 value -0.2~0.2：有搭配感但仍适合日常、轻时髦、普通人可穿。
      高方向 value 0.5~1：高级时装、杂志大片、秀场感、设计师款、造型感强、潮流、先锋、 editorial、大片氛围。
      生成锚点时不要把“成熟”或“复古”直接当成高时尚，需体现设计感/潮流感。
  - axis_name: maturity
    label: 风格成熟度
    description: >-
      少女年轻 ←→ 成熟稳重。该轴描述气质年龄感和社会角色感，不直接等同于妆容浓淡。
      低方向 value -1~-0.5：少女感、校园感、初恋感、青春、学生气、稚嫩、清纯、元气年轻、邻家妹妹。
      中性 value -0.2~0.2：年龄感不明显、自然年轻、轻熟但不强。
      高方向 value 0.5~1：成熟、御姐、职场感、大女人、稳重、知性、姐姐感、气场强、优雅成熟。
      生成锚点时覆盖“不要太幼”“别显老”“想更像职场头像”等表达。
  - axis_name: femininity
    label: 风格女性化程度
    description: >-
      中性/利落 ←→ 女性化/柔美。该轴描述造型、线条和气质的性别风格倾向。
      低方向 value -1~-0.5：中性风、酷女孩、boyish、利落、帅气、无性别感、宽松西装、短发感、不要太娇柔。
      中性 value -0.2~0.2：不过分强调性别气质、干净自然、可甜可酷。
      高方向 value 0.5~1：女性化、优雅、柔美、裙装、曲线感、温婉、精致女人味、浪漫柔和。
      生成锚点时避免和 sweetness 混淆：女性化可以优雅成熟，不一定可爱甜。
  - axis_name: sweetness
    label: 风格甜美度
    description: >-
      冷酷疏离 ←→ 甜美可爱。该轴描述亲和、可爱、元气和糖分感。
      低方向 value -1~-0.5：冷酷、清冷、疏离、高冷、酷感、淡漠、厌世脸、不要可爱、拒绝甜妹。
      中性 value -0.2~0.2：自然亲切、不冷也不过甜、干净舒服。
      高方向 value 0.5~1：甜美、可爱、元气、甜妹、笑容灿烂、软萌、亲和、粉色氛围、少女甜感。
      生成锚点时不要把“少女感”全部归为甜美，需体现可爱/亲和/甜。
  - axis_name: retro
    label: 风格复古度
    description: >-
      现代极简 ←→ 复古怀旧。该轴描述年代感、胶片感、经典复古元素和怀旧氛围。
      低方向 value -1~-0.5：现代、极简、未来感、干净利落、当代感、不要老照片感、拒绝港风和复古滤镜。
      中性 value -0.2~0.2：不过分现代也不过分复古、经典耐看。
      高方向 value 0.5~1：港风、法式复古、胶片感、老钱风、民国感、90年代、复古卷发、棕调、怀旧街景、经典画报。
      生成锚点时覆盖用户对“不要显旧”“想要胶片港风”的正负表达。
  - axis_name: oriental
    label: 风格东方感
    description: >-
      国际现代 ←→ 东方美学。该轴描述中式、东方、传统文化元素的强弱，不等同于复古。
      低方向 value -1~-0.5：欧美、国际化、现代时尚、都市感、不要中式元素、拒绝汉服旗袍、不要古风。
      中性 value -0.2~0.2：东方元素不明显、现代日常、轻微含蓄气质。
      高方向 value 0.5~1：新中式、汉服、旗袍、东方美学、国风、宋制明制、盘扣、玉簪、水墨、园林、含蓄古典。
      生成锚点时区分东方感和复古感：新中式可以现代，复古不一定东方。
